name: Run bounded growth producer
on:
  # Control Center wakes this engine once a day (about 06:10 London) with { directive_id, engine_id }.
  repository_dispatch:
    types: [cc-growth-directive]
  workflow_dispatch:
    inputs:
      mode:
        description: Producer operation; dispatch prepares and handles exact approved actions through Control Center
        type: choice
        options:
          - engine
          - daily
          - readiness
          - weekly-review
          - dispatch
        default: engine
        required: true
      commit:
        description: Legacy producer persistence; dispatch follows exact Control Center approvals
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mindmake-growth-operation
  cancel-in-progress: false
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode != 'dispatch'
    runs-on: ubuntu-latest
    environment: growth-runtime
    timeout-minutes: 3
    env:
      CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL || 'https://controlcenter.krishraja.com' }}
      MINDMAKE_GROWTH_TOKEN: ${{ secrets.GROWTH_ENGINE_TOKEN }}
      GROWTH_LAUNCH_DATE: ${{ vars.GROWTH_LAUNCH_DATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reject a write-enabled readiness request
        if: ${{ inputs.mode == 'readiness' && inputs.commit }}
        run: |
          echo 'Readiness is read-only. Leave commit disabled.' >&2
          exit 1
      - name: Read-only consumer readiness
        if: ${{ inputs.mode == 'readiness' && !inputs.commit }}
        run: node src/cli.mjs readiness
      - name: Dry daily plan
        if: ${{ inputs.mode == 'daily' && !inputs.commit }}
        run: node src/cli.mjs daily --summary
      - name: Dry complete engine cycle
        if: ${{ inputs.mode == 'engine' && !inputs.commit }}
        run: node src/cli.mjs engine --summary
      - name: Persist complete engine cycle
        if: ${{ inputs.mode == 'engine' && inputs.commit }}
        run: node src/cli.mjs engine --commit --summary
      - name: Persist daily producer artifacts
        if: ${{ inputs.mode == 'daily' && inputs.commit }}
        run: node src/cli.mjs daily --commit --summary
      - name: Dry weekly review
        if: ${{ inputs.mode == 'weekly-review' && !inputs.commit }}
        run: node src/cli.mjs weekly-review --summary
      - name: Persist weekly review
        if: ${{ inputs.mode == 'weekly-review' && inputs.commit }}
        run: node src/cli.mjs weekly-review --commit --summary

  # The Control Center protocol run (docs/control-center/ENGINE-PROTOCOL.md). It journals the
  # attempt, reads the directive, prepares dry, reports proposals and reads Krish's decisions.
  # Exact approved actions use Control Center's guarded executor and independent readback. No environment
  # gate, so a daily wake-up never waits for a manual approval. No artifact is uploaded.
  dispatch:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'repository_dispatch' || inputs.mode == 'dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL }}
      CONTROL_CENTER_ENGINE_TOKEN: ${{ secrets.CONTROL_CENTER_ENGINE_TOKEN }}
      # Optional read of the bounded snapshot. When absent the run holds and says so.
      MINDMAKE_GROWTH_TOKEN: ${{ secrets.GROWTH_ENGINE_TOKEN }}
      # The wake-up payload is data: it reaches the run only as environment values, never as shell text.
      CC_WAKE_ENGINE_ID: ${{ github.event.client_payload.engine_id }}
      CC_WAKE_DIRECTIVE_ID: ${{ github.event.client_payload.directive_id }}
    steps:
      - name: Reject a write-enabled dispatch request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit }}
        run: |
          echo 'The dispatch run never writes drafts. Leave commit disabled.' >&2
          exit 1
      - name: Require the Control Center binding
        run: |
          if [ -z "$CONTROL_CENTER_URL" ] || [ -z "$CONTROL_CENTER_ENGINE_TOKEN" ]; then
            echo 'CONTROL_CENTER_URL (repository variable) or CONTROL_CENTER_ENGINE_TOKEN (repository secret) is not set. Nothing was read or written.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Daily Control Center dispatch (dry; nothing sends)
        if: ${{ github.event_name == 'repository_dispatch' }}
        # Each wake reports under its own run id (a same-day refill is a new run, N01); a re-run of the same wake keeps its number and reuses its report.
        run: node src/cli.mjs dispatch --kind dispatch-${{ github.run_number }}
      - name: Manual Control Center dispatch (dry; nothing sends)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: node src/cli.mjs dispatch --kind manual-${{ github.run_number }}
