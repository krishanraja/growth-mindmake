name: Run bounded growth producer
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Producer operation; consumer support remains a separate rollout
        type: choice
        options:
          - engine
          - daily
          - readiness
          - weekly-review
        default: engine
        required: true
      commit:
        description: Persist artifacts only after the separate consumer rollout is ready
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mindmake-growth-operation
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: growth-runtime
    timeout-minutes: 3
    env:
      CONTROL_CENTER_URL: ${{ vars.CONTROL_CENTER_URL || 'https://controlcenter.krishraja.com' }}
      MINDMAKE_GROWTH_TOKEN: ${{ secrets.GROWTH_ENGINE_TOKEN }}
      GROWTH_LAUNCH_DATE: ${{ vars.GROWTH_LAUNCH_DATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reject a write-enabled readiness request
        if: ${{ inputs.mode == 'readiness' && inputs.commit }}
        run: |
          echo 'Readiness is read-only. Leave commit disabled.' >&2
          exit 1
      - name: Read-only consumer readiness
        if: ${{ inputs.mode == 'readiness' && !inputs.commit }}
        run: node src/cli.mjs readiness
      - name: Dry daily plan
        if: ${{ inputs.mode == 'daily' && !inputs.commit }}
        run: node src/cli.mjs daily --summary
      - name: Dry complete engine cycle
        if: ${{ inputs.mode == 'engine' && !inputs.commit }}
        run: node src/cli.mjs engine --summary
      - name: Persist complete engine cycle
        if: ${{ inputs.mode == 'engine' && inputs.commit }}
        run: node src/cli.mjs engine --commit --summary
      - name: Persist daily producer artifacts
        if: ${{ inputs.mode == 'daily' && inputs.commit }}
        run: node src/cli.mjs daily --commit --summary
      - name: Dry weekly review
        if: ${{ inputs.mode == 'weekly-review' && !inputs.commit }}
        run: node src/cli.mjs weekly-review --summary
      - name: Persist weekly review
        if: ${{ inputs.mode == 'weekly-review' && inputs.commit }}
        run: node src/cli.mjs weekly-review --commit --summary
