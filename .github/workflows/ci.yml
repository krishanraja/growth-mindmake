name: Verify growth engine
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  # A newer push to a pull request replaces its older check; a run on main is never cut short, so its fold always lands.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run contracts
      - run: npm test
      - run: npm run conveyor
      - run: npm run demo -- --summary
      - run: npm run demo:review
      - run: npm run demo:engine
      - run: npm run mutate
  fold:
    # A closeout note (now-notes/YYYY-MM-DD-<slug>.md) that reaches main is folded into NOW.md and removed,
    # so pull requests never edit NOW.md at once (Ruling, Krish, 2026-10-28) and NOW.md never goes stale
    # behind its notes. The fold is ai-harness's own closeout hook (`--fold`), read from its main at run
    # time: this repository is not one the harness publisher administers, so it keeps no copy of it.
    # Every attempt folds afresh from the newest main, so a north-star line or another fold landing first
    # never leaves a conflicted NOW.md. A push by this job starts no other workflow.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: closeout-fold
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: krishanraja/ai-harness
          ref: main
          path: .harness
          sparse-checkout: .claude/hooks/harness-closeout.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fold closeout notes into NOW.md
        run: |
          set -uo pipefail
          hook="$RUNNER_TEMP/harness-closeout.mjs"
          cp .harness/.claude/hooks/harness-closeout.mjs "$hook" && rm -rf .harness
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin "$GITHUB_REF_NAME" && git reset --quiet --hard "origin/$GITHUB_REF_NAME" || exit 1
            if ! ls now-notes/*.md >/dev/null 2>&1; then echo "No closeout notes to fold."; exit 0; fi
            status=0; node "$hook" --fold || status=$?
            if [ -z "$(git status --porcelain -- NOW.md now-notes)" ]; then exit "$status"; fi
            git add -A -- NOW.md now-notes
            git commit --quiet -m "docs(closeout): fold closeout notes into NOW.md" -m "Written by ai-harness's .claude/hooks/harness-closeout.mjs --fold, run by this repository's ci.yml."
            if git push --quiet origin "HEAD:$GITHUB_REF_NAME"; then exit "$status"; fi
            sleep $((attempt * 5))
          done
          echo "::error::Main kept moving; the notes stay in now-notes/ for the next push to main."
          exit 1
